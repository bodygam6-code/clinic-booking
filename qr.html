<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QR Code يشاور على صفحة حجز العيادة — اطبعه وحطه في العيادة">
  <title>QR Code - صفحة الحجز</title>
  <link rel="stylesheet" href="qr.css">
</head>
<body>
  <main class="card">

    <header class="card__header">
      <h1 class="card__title">📱 QR Code — صفحة الحجز</h1>
      <p class="card__subtitle">اطبع الصفحة دي واحطها عند مدخل العيادة أو على الريسبشن</p>
    </header>

    <img class="card__qr" id="qr-image" alt="QR Code صفحة الحجز">
    <p class="card__url" id="booking-url"></p>

    <div class="card__actions">
      <button class="button" type="button" id="print-button">🖨️ طباعة الـ QR</button>
      <a class="button button--secondary" id="open-booking-link" target="_blank" rel="noopener">🚀 فتح صفحة الحجز</a>
    </div>

    <p class="card__hint">
      الـ QR ده بيشاور على لينك صفحة الحجز الحالية.<br>
      لو غيرت مكان استضافة الصفحة، افتح <b>qr.html</b> من المكان الجديد وهيتحدث تلقائيًا.
    </p>
  </main>

  <script src="qr.js"></script>
</body>
</html>
